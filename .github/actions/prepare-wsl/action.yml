name: Prepare Ubuntu on Windows
description: Start WSL2, unpack the exact revision on its Linux filesystem and provision the benchmark
inputs:
  mode:
    description: fast or licensed
    required: true
runs:
  using: composite
  steps:
    - name: Install Ubuntu 24.04 on WSL2
      uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
      with:
        distribution: Ubuntu-24.04
        wsl-version: 2
        wsl-shell-user: benchmark
        use-cache: false
    - name: Verify WSL2 and prepare the full CI source revision
      shell: pwsh
      env:
        SOURCE_TOKEN: ${{ github.token }}
      run: |
        $distros = (wsl.exe --list --verbose | Out-String).Replace([string][char]0, '')
        if ($LASTEXITCODE -ne 0 -or $distros -notmatch '(?m)^\s*\*?\s*Ubuntu-24\.04\s+\S+\s+2\s*$') {
          throw "Expected Ubuntu-24.04 running under WSL version 2. Found $distros"
        }
        Write-Host $distros
        # Keep Git blob bytes and Unix modes, including the files used only by CI.
        $PSNativeCommandUseErrorActionPreference = $true
        $repository = Join-Path $env:RUNNER_TEMP 'wsl-ci-source.git'
        git init --bare --quiet $repository
        $env:CI_FETCH_HEADER = 'Authorization: Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:SOURCE_TOKEN"))
        try {
          git -C $repository --config-env=http.extraHeader=CI_FETCH_HEADER fetch --quiet --no-tags --depth=1 "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
        } finally {
          Remove-Item Env:CI_FETCH_HEADER
        }
        $revision = (git -C $repository rev-parse FETCH_HEAD).Trim()
        if ($revision -ne $env:GITHUB_SHA) { throw 'Fetched revision differs from the requested CI commit' }
        Set-Content -LiteralPath (Join-Path $repository 'info/attributes') -Value '* -text -export-ignore -export-subst' -Encoding ascii
        $tar = Join-Path $env:RUNNER_TEMP 'wsl-ci-source.tar.gz'
        git -c core.autocrlf=false -C $repository archive --format=tar.gz --prefix=source/ "--output=$tar" $revision
    - name: Prepare the project and scientific toolchain inside WSL2
      shell: wsl-bash -u root {0}
      env:
        BENCHMARK_MODE: ${{ inputs.mode }}
        WSLENV: RUNNER_TEMP/p:BENCHMARK_MODE/u
      run: |
        cat /proc/sys/kernel/osrelease
        grep -qi 'WSL2' /proc/sys/kernel/osrelease
        source /etc/os-release
        [[ $ID == ubuntu && $VERSION_ID == '24.04' ]]
        install -d /opt/madgraph-ci/source
        tar -xzf "$RUNNER_TEMP/wsl-ci-source.tar.gz" -C /opt/madgraph-ci/source --strip-components=1
        rm -f -- "$RUNNER_TEMP/wsl-ci-source.tar.gz"
        chown -R benchmark /opt/madgraph-ci/source
        cd /opt/madgraph-ci/source
        test -f ci/run_benchmark.py && test -d tests
        bash .github/workflows/prepare-host.sh "$BENCHMARK_MODE"
