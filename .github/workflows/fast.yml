name: Portable checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(startsWith(github.ref, 'refs/heads/single-runner/') && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Prepare Python and compilers
        run: bash .github/workflows/prepare-host.sh fast
      - name: Compare FeynRules contractions under protected Wolfram symbol names
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/mathics"
          "$RUNNER_TEMP/mathics/bin/python" -m pip install --disable-pip-version-check 'Mathics3==10.0.1'
          "$RUNNER_TEMP/mathics/bin/python" ci/check_feynrules_collision.py
      - name: Run portable regression tests
        shell: bash
        run: |
          export PATH="/tmp/madgraph-ci-tools:$PATH"
          python -m unittest discover -s tests
      - name: Run the fast benchmark
        shell: bash
        env:
          BENCHMARK_ARTIFACTS: ${{ github.workspace }}/ci-artifacts
        run: |
          export PATH="/tmp/madgraph-ci-tools:$PATH"
          python ci/run_benchmark.py --mode fast
      - name: Save benchmark summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-${{ matrix.host }}
          path: ci-artifacts/benchmark-fast.json
          if-no-files-found: error
          retention-days: 14

  windows-wsl:
    if: ${{ !startsWith(github.ref, 'refs/heads/single-runner/') }}
    name: Fast checks on Windows Server 2025 with WSL2
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/prepare-wsl
      - uses: ./.github/actions/prepare-wsl
        with:
          mode: fast
      - name: Run regressions and build the benchmark model inside WSL2
        shell: wsl-bash {0}
        env:
          BENCHMARK_ARTIFACTS: ${{ github.workspace }}/ci-artifacts
          WSLENV: BENCHMARK_ARTIFACTS/p
        run: |
          set -euo pipefail
          export PATH="/opt/madgraph-ci/venv/bin:/tmp/madgraph-ci-tools:$PATH"
          cd /opt/madgraph-ci/source
          python -m unittest discover -s tests
          python ci/run_benchmark.py --mode fast
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fast-windows-wsl2
          path: ci-artifacts/benchmark-fast.json
          if-no-files-found: error
          retention-days: 14
