name: Licensed platform benchmarks

on: workflow_dispatch

permissions:
  contents: read

# Only one licensed run may use the entitlement at a time, across all dispatches.
concurrency:
  group: licensed-platform-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    # This verification branch exercises the patched candidate on the two remaining hosts.
    if: github.ref == 'refs/heads/single-runner/verify-macos-wsl2' && github.actor == github.repository_owner
    name: Licensed benchmark on ${{ matrix.platform }}
    environment: licensed-benchmarks
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - platform: macos
            host: macos-15
          - platform: windows-wsl2
            host: windows-2025

    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    steps:
      - name: Check that an entitlement is configured
        shell: bash
        env:
          HAS_ENTITLEMENT: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID != '' }}
        run: |
          if [[ $HAS_ENTITLEMENT != true ]]; then
            echo 'Configure WOLFRAMSCRIPT_ENTITLEMENTID as a repository or licensed-benchmarks environment secret.' >&2
            exit 1
          fi
      - if: runner.os != 'Windows'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: runner.os != 'Windows'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - if: runner.os != 'Windows'
        name: Install the native toolchain and Wolfram Engine
        run: bash .github/workflows/prepare-host.sh licensed

      - if: runner.os == 'Windows'
        name: Check out hosted setup instructions
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/prepare-wsl
      - if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-wsl
        with:
          mode: licensed
      - name: Run the licensed benchmark on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 60
        env:
          ENTITLEMENT: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
          TRACE_ORIGINAL_FIELDS: ${{ github.ref == 'refs/heads/single-runner/wolfram15-ufo' }}
          BENCHMARK_ARTIFACTS: ${{ github.workspace }}/ci-artifacts
          WSLENV: ENTITLEMENT/u:BENCHMARK_ARTIFACTS/p:GITHUB_SHA/u:GITHUB_RUN_ID/u
        run: bash .github/workflows/run-licensed.sh
      - name: Run the licensed benchmark inside WSL2
        if: runner.os == 'Windows'
        shell: wsl-bash {0}
        timeout-minutes: 60
        env:
          ENTITLEMENT: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
          BENCHMARK_ARTIFACTS: ${{ github.workspace }}/ci-artifacts
          WSLENV: ENTITLEMENT/u:BENCHMARK_ARTIFACTS/p:GITHUB_SHA/u:GITHUB_RUN_ID/u
        run: bash /opt/madgraph-ci/source/.github/workflows/run-licensed.sh
      - name: Save benchmark summary
        if: ${{ !cancelled() && hashFiles('ci-artifacts/.safe-to-publish') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licensed-${{ matrix.platform }}
          path: |
            ci-artifacts/benchmark-licensed.json
            ci-artifacts/ranking.csv
            ci-artifacts/field-trace.json
          if-no-files-found: error
          retention-days: 14
